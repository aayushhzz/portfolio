<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Aayush Portfolio — Platform and AI Engineer on Cloudflare Workers">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="55%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e4e4e7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#3f3f46" stroke-width="0.6" stroke-opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#3f3f46" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Emblem: Procedural ink skyline & monogram inspired by portfolio footer -->
  <g transform="translate(76, 56)">
    <rect x="0" y="0" width="188" height="188" rx="26" fill="#f7f7f5" stroke="#27272a" stroke-width="1.5"/>
    <!-- Monogram top-left -->
    <text x="20" y="42" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.04em">A.</text>
    <text x="168" y="38" text-anchor="end" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">&lt;/&gt;</text>

    <!-- Subtle background skyline -->
    <rect x="26" y="74" width="34" height="74" fill="#e9e9e6" stroke="#a1a1aa" stroke-width="1.4"/>
    <rect x="122" y="64" width="36" height="84" fill="#e9e9e6" stroke="#a1a1aa" stroke-width="1.4"/>

    <!-- Foreground ink buildings -->
    <rect x="18" y="96" width="38" height="52" fill="#f7f7f5" stroke="#111111" stroke-width="2.2"/>
    <rect x="26" y="106" width="7" height="9" fill="#111111"/>
    <rect x="39" y="106" width="7" height="9" fill="#f7f7f5" stroke="#111111" stroke-width="1.2"/>
    <rect x="26" y="122" width="7" height="9" fill="#f7f7f5" stroke="#111111" stroke-width="1.2"/>
    <rect x="39" y="122" width="7" height="9" fill="#f97316"/>

    <!-- Center tower with spire -->
    <line x1="94" y1="48" x2="94" y2="66" stroke="#111111" stroke-width="2.2"/>
    <rect x="82" y="66" width="24" height="10" fill="#f7f7f5" stroke="#111111" stroke-width="2"/>
    <rect x="68" y="76" width="52" height="72" fill="#f7f7f5" stroke="#111111" stroke-width="2.2"/>
    <rect x="77" y="88" width="8" height="10" fill="#f97316"/>
    <rect x="90" y="88" width="8" height="10" fill="#f7f7f5" stroke="#111111" stroke-width="1.2"/>
    <rect x="103" y="88" width="8" height="10" fill="#111111"/>
    <rect x="77" y="105" width="8" height="10" fill="#111111"/>
    <rect x="90" y="105" width="8" height="10" fill="#f7f7f5" stroke="#111111" stroke-width="1.2"/>
    <rect x="103" y="105" width="8" height="10" fill="#f7f7f5" stroke="#111111" stroke-width="1.2"/>
    <rect x="88" y="130" width="12" height="18" fill="#111111"/>

    <!-- Right building -->
    <polygon points="132,92 151,76 170,92" fill="#f7f7f5" stroke="#111111" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="132" y="92" width="38" height="56" fill="#f7f7f5" stroke="#111111" stroke-width="2.2"/>
    <rect x="140" y="103" width="7" height="9" fill="#f7f7f5" stroke="#111111" stroke-width="1.2"/>
    <rect x="153" y="103" width="7" height="9" fill="#111111"/>
    <rect x="140" y="119" width="7" height="9" fill="#f97316"/>
    <rect x="153" y="119" width="7" height="9" fill="#f7f7f5" stroke="#111111" stroke-width="1.2"/>

    <!-- Ground line + dashed road -->
    <line x1="12" y1="148" x2="176" y2="148" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="20" y1="160" x2="168" y2="160" stroke="#71717a" stroke-width="1.6" stroke-dasharray="10 8"/>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(306, 98)">
    <rect x="0" y="-26" width="256" height="24" rx="12" fill="#431407" fill-opacity="0.7" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="14" y="-10" fill="#fdba74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="0.06em">CLOUDFLARE WORKERS STATIC</text>

    <text x="0" y="52" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.03em">Aayush. Portfolio</text>
    <text x="2" y="92" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Zero-dependency animated portfolio with a procedural SVG skyline at the edge.</text>

    <!-- Pills -->
    <g transform="translate(0, 118)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="128" height="28" rx="8" fill="#18181b" stroke="#3f3f46"/>
      <text x="64" y="18" text-anchor="middle" fill="#fafafa">HTML · CSS · JS</text>

      <rect x="140" y="0" width="160" height="28" rx="8" fill="#18181b" stroke="#3f3f46"/>
      <text x="220" y="18" text-anchor="middle" fill="#fdba74">Cloudflare Workers</text>

      <rect x="312" y="0" width="146" height="28" rx="8" fill="#18181b" stroke="#3f3f46"/>
      <text x="385" y="18" text-anchor="middle" fill="#d4d4d8">Procedural SVG</text>

      <rect x="470" y="0" width="142" height="28" rx="8" fill="#18181b" stroke="#3f3f46"/>
      <text x="541" y="18" text-anchor="middle" fill="#a1a1aa">0 Runtime Deps</text>
    </g>
  </g>
</svg>
